name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v -s plugins/sc-plan-anchor/skills/plan-anchoring/tests
      - run: python scripts/check_version_sync.py
      - if: github.event_name == 'pull_request'
        run: python scripts/check_version_sync.py --base origin/${{ github.base_ref }}
