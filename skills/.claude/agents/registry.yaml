# Agent registry for plan-anchoring. Paths are relative to the project root
# after installation (this repo keeps the tree under skills/.claude/).
agents:
  anchor-plan-review:
    version: 0.2.0
    path: .claude/agents/anchor-plan-review.md
  anchor-sprint-review:
    version: 0.2.0
    path: .claude/agents/anchor-sprint-review.md

skills:
  plan-anchoring:
    version: 0.2.0
    path: .claude/skills/plan-anchoring/SKILL.md
    depends_on:
      anchor-plan-review: "0.x"
      anchor-sprint-review: "0.x"
