# Codex agent registry for plan-anchoring. Paths are relative to the project
# root after installation (this repo keeps the tree under skills/.codex/).
agents:
  anchor-plan-review:
    version: 0.4.0
    path: .codex/agents/anchor-plan-review.md
  anchor-sprint-review:
    version: 0.4.0
    path: .codex/agents/anchor-sprint-review.md
  anchor-question-tune:
    version: 0.4.0
    path: .codex/agents/anchor-question-tune.md

skills:
  plan-anchoring:
    version: 0.4.0
    path: .claude/skills/plan-anchoring/SKILL.md
    depends_on:
      anchor-plan-review: "0.x"
      anchor-sprint-review: "0.x"
      anchor-question-tune: "0.x"
